   header h1 { margin: 0; }
   #search-bar { padding: 10px 14px; border-radius: 6px; border: 1px solid #333; background: #1e1e1e; color: #fff; width: 260px; font-size: 0.95rem; }
   button { background: #3b82f6; color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; }
   button:hover { background: #2563eb; }
   button.secondary { background: #333; }
   button.secondary:hover { background: #444; }
   .container { max-width: 1100px; margin: 0 auto; }
   .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
      .card {
     background: #1e1e1e;
     border-radius: 10px;
     overflow: hidden;
     cursor: pointer;
     transition: transform 0.15s, border-color 0.15s;
     border: 1px solid #2e2e2e;
     display: flex;
     flex-direction: column;
   }
   .card:hover {
     transform: translateY(-4px);
     border-color: #3b82f6;
   }
   .card img {
     width: 100%;
     height: 220px;
     object-fit: contain;
     background: #0f0f0f;
     display: block;
   }






   .card h3 { margin: 12px; font-size: 1rem; }
   .hidden { display: none; }
   #player-view iframe { width: 100%; height: 78vh; border: none; border-radius: 8px; background: #000; }
 </style>

function renderGrid(list) {
 const grid = document.getElementById("game-grid");
 grid.innerHTML = "";
 const fallbackImg = "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(
   '<svg xmlns="http://w3.org" width="400" height="250"><rect width="100%" height="100%" fill="#222"/><text x="50%" y="50%" fill="#888" font-family="sans-serif" font-size="18" dominant-baseline="middle" text-anchor="middle">No Cover</text></svg>'
 );
 list.forEach((game) => {
   const card = document.createElement("div");
   card.className = "card";
   card.onclick = () => launchGame(game);
   const img = document.createElement("img");
   img.src = game.image;
   img.alt = game.title;
   img.onerror = () => { img.onerror = null; img.src = fallbackImg; };
   const title = document.createElement("h3");
   title.textContent = game.title;
   card.appendChild(img);
   card.appendChild(title);
   grid.appendChild(card);
 });
}






   function filterGames() {
     const query = document.getElementById("search-bar").value.toLowerCase();
     const filtered = games.filter(g => g.title.toLowerCase().includes(query));
     renderGrid(filtered);
   }



   function launchGame(game) {
     document.getElementById("active-game-title").textContent = game.title;
     document.getElementById("game-frame").src = game.path;
     document.getElementById("library").classList.add("hidden");
     document.getElementById("search-bar").classList.add("hidden");
     document.getElementById("player-view").classList.remove("hidden");
   }



   function closeGame() {
     document.getElementById("game-frame").src = "";
     document.getElementById("player-view").classList.add("hidden");
     document.getElementById("library").classList.remove("hidden");
     document.getElementById("search-bar").classList.remove("hidden");
   }



   function goFullscreen() {
     const frame = document.getElementById("game-frame");
     if (frame.requestFullscreen) frame.requestFullscreen();
   }



   renderGrid(games);
