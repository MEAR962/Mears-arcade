<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mears Arcade Drove</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #121212; color: #f5f5f5; margin: 0; padding: 20px; }
    header { display: flex; justify-content: space-between; align-items: center; max-width: 1100px; margin: 0 auto 24px; gap: 16px; flex-wrap: wrap; }
    header h1 { margin: 0; }
    #search-bar { padding: 10px 14px; border-radius: 6px; border: 1px solid #333; background: #1e1e1e; color: #fff; width: 260px; font-size: 0.95rem; }
    button { background: #3b82f6; color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    button:hover { background: #2563eb; }
    button.secondary { background: #333; }
    button.secondary:hover { background: #444; }
    .container { max-width: 1100px; margin: 0 auto; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
    .card { background: #1e1e1e; border-radius: 10px; overflow: hidden; cursor: pointer; transition: transform 0.15s, border-color 0.15s; border: 1px solid #2e2e2e; }
    .card:hover { transform: translateY(-4px); border-color: #3b82f6; }
    .card img { width: 100%; height: 140px; object-fit: cover; background: #2a2a2a; display: block; }
    .card h3 { margin: 12px; font-size: 1rem; }
    .hidden { display: none; }
    #player-view iframe { width: 100%; height: 78vh; border: none; border-radius: 8px; background: #000; }
  </style>
</head>
<body>

  <header>
    <h1>Mears Arcade Drove</h1>
    <input type="text" id="search-bar" placeholder="Search games..." oninput="filterGames()" />
  </header>

  <div class="container">

    <section id="library">
      <div class="grid" id="game-grid"></div>
    </section>

    <section id="player-view" class="hidden">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <h2 id="active-game-title" style="margin:0;">Playing Game</h2>
        <div>
          <button onclick="goFullscreen()" style="margin-right:8px;">⛶ Fullscreen</button>
          <button class="secondary" onclick="closeGame()">← Back to Library</button>
        </div>
      </div>
      <iframe id="game-frame" sandbox="allow-scripts allow-same-origin allow-pointer-lock allow-downloads" allowfullscreen></iframe>
    </section>
  </div>

  <script>

const games = [
  {
    title: "Scarlet Shift",
    image: "https://gstatic.com",
    path: "games/scarletshift.html"
  },
  {
    title: "Five Nights at Freddy's 1",
    image: "https://gstatic.com",
    path: "games/Five Nights at Freddy's.html"
  },
  {
    title: "Five Nights at Freddy's 2",
    image: "https://gstatic.com",
    path: "games/Five Nights at Freddy's 2.html"
  },
  {
    title: "Five Nights at Freddy's 3",
    image: "https://gstatic.com",
    path: "games/Five Nights at Freddy's 3.html"
  },
  {
    title: "Five Nights at Freddy's 4",
    image: "https://gstatic.com",
    path: "games/Five Nights at Freddy's 4.html"
  },
  {
    title: "Five Nights at Freddy's Into The Pit",
    image: "https://gstatic.com",
    path: "games/Five Nights at Freddy's_ Into The Pit.html"
  },
  {
    title: "Five Nights at Freddy's Pizza Simulator",
    image: "https://gstatic.com",
    path: "games/Five Nights at Freddy's_ Pizza Simulator.html"
  },
  {
    title: "Five Nights at Freddy's Sister Location",
    image: "https://gstatic.com",
    path: "games/Five Nights at Freddy's_ Sister Location.html"
  },
  {
    title: "Five Nights at Freddy's Ultimate Custom Night",
    image: "https://gstatic.com",
    path: "games/Five Nights at Freddy's_ Ultimate Custom Night.html"
  },
  {
    title: "Five Nights at Freddy's World",
    image: "https://gstatic.com",
    path: "games/Five Nights at Freddy's_ World.html"
  }
];


  

function renderGrid(list) {
  const grid = document.getElementById("game-grid");
  grid.innerHTML = "";
  list.forEach((game) => {
    const card = document.createElement("div");
    card.className = "card";
    card.onclick = () => launchGame(game);
    card.innerHTML = `
      <img src="${game.image}" alt="${game.title}" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://w3.org width=%22400%22 height=%22250%22><rect width=%22100%25%22 height=%22100%25%22 fill=%22%23222%22/><text x=%2250%25%22 y=%2250%25%22 fill=%22%23888%22 font-family=%22sans-serif%22 font-size=%2218%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22>No Cover</text></svg>';">
      <h3>${game.title}</h3>
    `;
    grid.appendChild(card);
  });
}


    function filterGames() {
      const query = document.getElementById("search-bar").value.toLowerCase();
      const filtered = games.filter(g => g.title.toLowerCase().includes(query));
      renderGrid(filtered);
    }

    function launchGame(game) {
      document.getElementById("active-game-title").textContent = game.title;
      document.getElementById("game-frame").src = game.path;
      document.getElementById("library").classList.add("hidden");
      document.getElementById("search-bar").classList.add("hidden");
      document.getElementById("player-view").classList.remove("hidden");
    }

    function closeGame() {
      document.getElementById("game-frame").src = "";
      document.getElementById("player-view").classList.add("hidden");
      document.getElementById("library").classList.remove("hidden");
      document.getElementById("search-bar").classList.remove("hidden");
    }

    function goFullscreen() {
      const frame = document.getElementById("game-frame");
      if (frame.requestFullscreen) frame.requestFullscreen();
    }

    renderGrid(games);
  </script>
</body>
</html>
